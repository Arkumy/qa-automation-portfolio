name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node.js for Allure
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Allure CLI
        run: npm install --global allure@3.20.1

      - name: Run API tests
        id: tests
        # These are the public credentials of the Restful Booker demo API.
        env:
          API_BASE_URL: https://restful-booker.herokuapp.com
          API_LOGIN: admin
          API_PASSWORD: password123
        run: python -m pytest tests/api -v --alluredir=allure-results --clean-alluredir

      - name: Upload Allure results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: error

      - name: Generate Allure report
        id: report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: allure generate allure-results --output allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: error
